<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة غير موجودة — مشروعي</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C8502E">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>
html,body{height:100%;margin:0}
body{background-color:#FBF5EA;background-image:repeating-linear-gradient(60deg,rgba(200,80,46,.07) 0 1px,transparent 1px 26px),repeating-linear-gradient(-60deg,rgba(200,80,46,.07) 0 1px,transparent 1px 26px);color:#1E2233;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
main{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.code{font-family:Alexandria,sans-serif;font-weight:800;font-size:96px;line-height:1;color:#C8502E}
h1{margin:0;font-family:Alexandria,sans-serif;font-weight:800;font-size:30px;line-height:1.4}
p{margin:0;font-size:17px;line-height:1.8;color:#5A607A}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
a{height:54px;padding:0 26px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-family:Alexandria,sans-serif;font-weight:700;font-size:17px;text-decoration:none}
.or{background:#C8502E;color:#FFFFFF;box-shadow:0 10px 24px rgba(200,80,46,.26)}.or:hover{background:#B04425}
.out{background:#FFFFFF;color:#1E2233;border:2px solid #E7DAC0}.out:hover{border-color:#C8502E}
a:focus-visible{outline:3px solid #C8502E;outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo.svg" width="64" height="64" alt="شعار مشروعي">
  <div class="code">404</div>
  <h1>هالصفحة مو موجودة</h1>
  <p>يمكن الرابط قديم أو فيه خطأ. ارجع للرئيسية، أو ابدأ طلبك مباشرة.</p>
  <div class="row">
    <a class="or" href="/order">اطلب مشروعك</a>
    <a class="out" href="/">الرئيسية</a>
  </div>
</main>
</body>
</html>
